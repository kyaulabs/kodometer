<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="750" viewBox="0 0 1120 750"><path fill="#F7F5FB" d="M0 0H1120V750H0Z"/><text x="56" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#625C73">KODOMETER / SOFT IRIS</text><text x="56" y="107" font-family="Segoe UI,Arial,sans-serif" font-size="38" font-weight="600" fill="#252333">Soft Iris palette</text><text x="56" y="143" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#625C73">Fixed brand colors for artwork and controlled website surfaces.</text><rect x="56" y="202" width="130" height="145" rx="10" fill="#A28BE0"/><text x="56" y="379" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#252333">Iris</text><text x="56" y="410" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#625C73">#A28BE0</text><rect x="201" y="202" width="130" height="145" rx="10" fill="#7052B5"/><text x="201" y="379" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#252333">Deep Iris</text><text x="201" y="410" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#625C73">#7052B5</text><rect x="346" y="202" width="130" height="145" rx="10" fill="#C2B0E8"/><text x="346" y="379" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#252333">Pale Iris</text><text x="346" y="410" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#625C73">#C2B0E8</text><rect x="491" y="202" width="130" height="145" rx="10" fill="#252333"/><text x="491" y="379" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#252333">Ink</text><text x="491" y="410" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#625C73">#252333</text><rect x="636" y="202" width="130" height="145" rx="10" fill="#F7F5FB"/><text x="636" y="379" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#252333">Cloud</text><text x="636" y="410" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#625C73">#F7F5FB</text><rect x="781" y="202" width="130" height="145" rx="10" fill="#B8B0CB"/><text x="781" y="379" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#252333">Mist</text><text x="781" y="410" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#625C73">#B8B0CB</text><rect x="926" y="202" width="130" height="145" rx="10" fill="#1B1924"/><text x="926" y="379" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#252333">Night</text><text x="926" y="410" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#625C73">#1B1924</text><text x="56" y="490" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#252333">Iris is the signature accent. Deep Iris supports light-surface controls and graphics.</text><text x="56" y="519" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#252333">Ink, Cloud and Night provide the neutral foundation. Mist supports secondary content.</text><text x="56" y="548" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#252333">Use accent color selectively; reserve status colors for their meaning.</text><rect x="56" y="688" width="1008" height="1" rx="0" fill="#DDD7E7"/><text x="56" y="723" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#625C73">BRAND GUIDELINES / 1.0</text><text x="1025" y="723" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#625C73">04</text></svg>