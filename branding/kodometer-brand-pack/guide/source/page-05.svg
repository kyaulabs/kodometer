<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="750" viewBox="0 0 1120 750"><path fill="#F7F5FB" d="M0 0H1120V750H0Z"/><text x="56" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#625C73">KODOMETER / SOFT IRIS</text><text x="56" y="107" font-family="Segoe UI,Arial,sans-serif" font-size="38" font-weight="600" fill="#252333">Website colors</text><text x="56" y="143" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#625C73">A complete light and dark token set is included in website/colors.css.</text><rect x="56" y="190" width="480" height="260" rx="12" fill="#F7F5FB"/><rect x="74" y="208" width="444" height="224" rx="10" fill="#FFFFFF"/><text x="94" y="251" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="600" fill="#252333">Know your capacity.</text><text x="94" y="288" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#625C73">AI usage, clearly presented.</text><rect x="94" y="327" width="230" height="48" rx="8" fill="#7052B5"/><text x="112" y="357" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#FFFFFF">Explore Kodometer</text><rect x="584" y="190" width="480" height="260" rx="12" fill="#1B1924"/><rect x="602" y="208" width="444" height="224" rx="10" fill="#252333"/><text x="622" y="251" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="600" fill="#F7F5FB">Know your capacity.</text><text x="622" y="288" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#B8B0CB">AI usage, clearly presented.</text><rect x="622" y="327" width="230" height="48" rx="8" fill="#A28BE0"/><text x="640" y="357" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#1B1924">Explore Kodometer</text><text x="56" y="499" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#252333">Light: Cloud canvas, white surfaces, Ink text, Deep Iris actions.</text><text x="56" y="528" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#252333">Dark: Night canvas, Ink surfaces, Cloud text, Iris actions with Night labels.</text><text x="56" y="557" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#252333">White on Deep Iris: 5.89:1. Night on Iris: 6.03:1.</text><text x="56" y="586" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#252333">Use the supplied stronger control border for input outlines; pale dividers are decorative.</text><rect x="56" y="688" width="1008" height="1" rx="0" fill="#DDD7E7"/><text x="56" y="723" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#625C73">BRAND GUIDELINES / 1.0</text><text x="1025" y="723" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#625C73">05</text></svg>