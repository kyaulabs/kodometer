<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="750" viewBox="0 0 1120 750"><path fill="#F7F5FB" d="M0 0H1120V750H0Z"/><text x="56" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#625C73">KODOMETER / SOFT IRIS</text><text x="56" y="107" font-family="Segoe UI,Arial,sans-serif" font-size="38" font-weight="600" fill="#252333">Native to Plasma 6</text><text x="56" y="143" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#625C73">The user’s desktop theme controls the interface.</text><text x="56" y="211" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#252333">BACKGROUNDS, TEXT &amp; CONTROLS</text><text x="56" y="244" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#252333">Inherit Plasma / Kirigami theme roles for surfaces, text, selection and focus.</text><text x="56" y="277" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#252333">Do not force website hex values into the popup or override the desktop font.</text><text x="56" y="310" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#252333"></text><text x="56" y="343" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#252333">PANEL &amp; METERS</text><text x="56" y="376" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#252333">Use the symbolic icon with the panel foreground. A light and dark fallback is included.</text><text x="56" y="409" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#252333">Use the system highlight for meters, or an optional Iris accent after surface checks.</text><text x="56" y="442" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#252333">Use Deep Iris on light surfaces and Iris on dark surfaces when brand accents are enabled.</text><text x="56" y="475" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#252333"></text><text x="56" y="508" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#252333">PROVIDERS &amp; STATUS</text><text x="56" y="541" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#252333">Keep provider identity colors distinct. Use desktop semantic colors for status.</text><text x="56" y="574" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#252333">Pair quota warnings with labels or icons; do not depend on color alone.</text><rect x="56" y="688" width="1008" height="1" rx="0" fill="#DDD7E7"/><text x="56" y="723" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#625C73">BRAND GUIDELINES / 1.0</text><text x="1025" y="723" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#625C73">06</text></svg>