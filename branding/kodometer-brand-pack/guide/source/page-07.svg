<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="750" viewBox="0 0 1120 750"><path fill="#F7F5FB" d="M0 0H1120V750H0Z"/><text x="56" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#625C73">KODOMETER / SOFT IRIS</text><text x="56" y="107" font-family="Segoe UI,Arial,sans-serif" font-size="38" font-weight="600" fill="#252333">Icons at every scale</text><text x="56" y="143" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#625C73">A detailed mark for large uses; a simplified symbolic mark for the panel.</text><g transform="translate(70 180) scale(1.2)"><path fill="#252333" d="M20 116Q20 107 29 107H45Q54 107 54 116V166L122 100L132 109L54 190V247Q54 256 45 256H29Q20 256 20 247Z M70 185Q75 180 80 185L155 247Q163 256 152 256H126Q120 256 116 252L66 205Q61 200 66 194Z"/><path fill="none" stroke="#A28BE0" stroke-width="18" stroke-linecap="round" d="M40 64Q85 25 133 52"/><circle fill="#A28BE0" cx="143" cy="92" r="10"/><path fill="#252333" d="M156 62Q160 57 164 61L181 79Q185 84 181 88L171 95L150 72Z"/><path fill="#252333" d="M182 103L193 100Q197 101 198 106L202 126Q203 131 198 132H187Z"/></g><g transform="translate(380 250) scale(0.7)"><path fill="#252333" d="M20 116Q20 107 29 107H45Q54 107 54 116V166L122 100L132 109L54 190V247Q54 256 45 256H29Q20 256 20 247Z M70 185Q75 180 80 185L155 247Q163 256 152 256H126Q120 256 116 252L66 205Q61 200 66 194Z"/><path fill="none" stroke="#252333" stroke-width="18" stroke-linecap="round" d="M40 64Q85 25 133 52"/><circle fill="#252333" cx="143" cy="92" r="10"/><path fill="#252333" d="M156 62Q160 57 164 61L181 79Q185 84 181 88L171 95L150 72Z"/></g><rect x="680" y="195" width="260" height="260" rx="40" fill="#1B1924"/><g transform="translate(708 193) scale(0.9)"><path fill="#F7F5FB" d="M20 116Q20 107 29 107H45Q54 107 54 116V166L122 100L132 109L54 190V247Q54 256 45 256H29Q20 256 20 247Z M70 185Q75 180 80 185L155 247Q163 256 152 256H126Q120 256 116 252L66 205Q61 200 66 194Z"/><path fill="none" stroke="#A28BE0" stroke-width="18" stroke-linecap="round" d="M40 64Q85 25 133 52"/><circle fill="#A28BE0" cx="143" cy="92" r="10"/><path fill="#F7F5FB" d="M156 62Q160 57 164 61L181 79Q185 84 181 88L171 95L150 72Z"/><path fill="#F7F5FB" d="M182 103L193 100Q197 101 198 106L202 126Q203 131 198 132H187Z"/></g><text x="56" y="558" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#252333">Panel exports: 16, 22, 24, 32, 48 and 64 px. Full icons: up to 1024 px.</text><text x="56" y="587" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#252333">The small mark omits the lowest gauge segment to reduce visual clutter.</text><text x="56" y="616" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" fill="#252333">Favicons include SVG, PNG, multi-size ICO, Apple touch and web manifest assets.</text><rect x="56" y="688" width="1008" height="1" rx="0" fill="#DDD7E7"/><text x="56" y="723" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#625C73">BRAND GUIDELINES / 1.0</text><text x="1025" y="723" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#625C73">07</text></svg>