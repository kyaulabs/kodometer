<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="750" viewBox="0 0 1120 750"><path fill="#F7F5FB" d="M0 0H1120V750H0Z"/><text x="56" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#625C73">KODOMETER / SOFT IRIS</text><text x="56" y="107" font-family="Segoe UI,Arial,sans-serif" font-size="38" font-weight="600" fill="#252333">Space and typography</text><text x="56" y="143" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#625C73">Preserve the letterforms. Let the interface remain native.</text><text x="56" y="207" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#252333">CLEAR SPACE</text><text x="56" y="239" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#252333">Keep at least one K stem width clear on every side of visible artwork.</text><text x="56" y="271" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#252333">The transparent files include modest framing; add layout space around them.</text><text x="56" y="303" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#252333"></text><text x="56" y="335" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#252333">MINIMUM SIZE</text><text x="56" y="367" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#252333">Full wordmark: recommended minimum 180 CSS px or 40 mm in print.</text><text x="56" y="399" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#252333">Below that size, use the standalone icon. Symbolic icons include a 16 px rendition.</text><text x="56" y="431" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#252333"></text><text x="56" y="463" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#252333">TYPE</text><text x="56" y="495" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#252333">Logo lettering is outlined, inspired by the supplied Neo Sans Pro Medium reference.</text><text x="56" y="527" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#252333">The custom e is built into the artwork. No font installation is required for the logo.</text><text x="56" y="559" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#252333">Plasma uses the desktop font. Websites use the supplied system sans-serif stack.</text><text x="56" y="591" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#252333">The commercial font file is not included; a separate text-use license is not supplied.</text><rect x="56" y="688" width="1008" height="1" rx="0" fill="#DDD7E7"/><text x="56" y="723" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#625C73">BRAND GUIDELINES / 1.0</text><text x="1025" y="723" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#625C73">08</text></svg>