<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="750" viewBox="0 0 1120 750"><path fill="#F7F5FB" d="M0 0H1120V750H0Z"/><text x="56" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#625C73">KODOMETER / SOFT IRIS</text><text x="56" y="107" font-family="Segoe UI,Arial,sans-serif" font-size="38" font-weight="600" fill="#252333">Status and accessibility</text><text x="56" y="143" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#625C73">Website status colors are paired; Plasma status colors remain theme-owned.</text><text x="56" y="213" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#252333">WEBSITE / FOREGROUND ON BACKGROUND</text><text x="56" y="246" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#252333">Success   #24704F on #EAF6EF        Warning   #855710 on #FFF4DD</text><text x="56" y="279" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#252333">Error       #AB354D on #FCEEF1        Info          #34649C on #EDF3FC</text><text x="56" y="312" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#252333"></text><text x="56" y="345" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#252333">CONTRAST</text><text x="56" y="378" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#252333">Defined website status pairs exceed 5.4:1. Body text exceeds 14:1.</text><text x="56" y="411" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#252333">These figures apply to the exact opaque pairs, not to arbitrary desktop themes.</text><text x="56" y="444" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#252333"></text><text x="56" y="477" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#252333">BEFORE SHIPPING</text><text x="56" y="510" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#252333">Check symbolic recoloring, light/dark/custom themes and translucent panels.</text><text x="56" y="543" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#252333">Check focus, disabled states and meter visibility in the actual running widget.</text><text x="56" y="576" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#252333">Keep labels available for status and data; never use accent color alone as a key.</text><rect x="56" y="688" width="1008" height="1" rx="0" fill="#DDD7E7"/><text x="56" y="723" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#625C73">BRAND GUIDELINES / 1.0</text><text x="1025" y="723" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#625C73">09</text></svg>