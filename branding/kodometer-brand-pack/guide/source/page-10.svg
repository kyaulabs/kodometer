<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="750" viewBox="0 0 1120 750"><path fill="#F7F5FB" d="M0 0H1120V750H0Z"/><text x="56" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#625C73">KODOMETER / SOFT IRIS</text><text x="56" y="107" font-family="Segoe UI,Arial,sans-serif" font-size="38" font-weight="600" fill="#252333">Files and handoff</text><text x="56" y="143" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#625C73">SVG masters are editable paths. PNGs are ready for use.</text><text x="56" y="208" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#252333">logos/       Full wordmarks: light, dark, deep-iris and monochrome</text><text x="56" y="241" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#252333">icons/       Standalone marks and light/dark app tiles</text><text x="56" y="274" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#252333">plasma/    Symbolic theme-aware SVG and fixed-color size exports</text><text x="56" y="307" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#252333">favicons/  Browser icons, Apple touch icon and installable-site manifest</text><text x="56" y="340" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#252333">website/   CSS tokens, JSON color data and integration snippet</text><text x="56" y="373" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#252333">boards/    Identity board in SVG and PNG</text><text x="56" y="406" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#252333">guide/      This PDF plus SVG and PNG page sources</text><text x="56" y="439" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#252333"></text><text x="56" y="472" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#252333">The repository has not been modified. Integration examples require project wiring.</text><text x="56" y="505" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#252333">Artwork was rebuilt as vector paths from the approved concept and font reference.</text><text x="56" y="538" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#252333">The native widget has not been runtime-tested in this Windows environment.</text><rect x="56" y="688" width="1008" height="1" rx="0" fill="#DDD7E7"/><text x="56" y="723" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#625C73">BRAND GUIDELINES / 1.0</text><text x="1025" y="723" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#625C73">10</text></svg>